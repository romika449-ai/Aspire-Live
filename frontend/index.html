<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HLS Player - Live Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- ===== NAVBAR ===== -->
        <header class="navbar">
            <a href="#" class="brand">
                <span class="brand-icon"><i class="fas fa-play"></i></span>
                <span class="brand-text">MyStream Pro</span>
            </a>
            <div class="nav-status">
                <span class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">लाइव</span>
                </span>
                <span style="color: var(--text-muted); font-size: 13px;">
                    <i class="fas fa-users" style="margin-right: 4px;"></i>
                    <span id="viewerCountNav">0</span>
                </span>
            </div>
        </header>

        <!-- ===== MAIN CARD ===== -->
        <main class="main-card">

            <!-- ===== VIDEO PLAYER ===== -->
            <div class="player-wrapper">
                <video id="videoPlayer" controls playsinline autoplay preload="auto"></video>
            </div>

            <!-- ===== CONTROLS BAR ===== -->
            <div class="controls-bar">
                <span class="url-label"><i class="fas fa-link"></i> URL</span>
                <input type="text" class="url-input" id="videoUrlInput"
                       placeholder="https://example.com/stream.m3u8"
                       value="https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8">
                <button class="btn btn-primary" onclick="loadManualLink()">
                    <i class="fas fa-play"></i> Play
                </button>
                <button class="btn btn-outline" onclick="resetPlayer()">
                    <i class="fas fa-undo-alt"></i>
                </button>
            </div>

            <!-- ===== STATUS BAR ===== -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot-green"></span>
                    <span class="label">स्थिति:</span>
                    <span class="value" id="statusText">तैयार</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-eye"></i> दर्शक:</span>
                    <span class="value" id="viewerCount">0</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                    <span class="value" id="playerInfo">hls.js</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-signal"></i> क्वालिटी:</span>
                    <span class="value" id="qualityInfo">-</span>
                </div>
            </div>

            <!-- ===== MESSAGE ===== -->
            <div id="message" class="message"></div>

            <!-- ===== PROXY CONFIG ===== -->
            <div style="margin-top: 12px; font-size: 12px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-color); padding-top: 12px;">
                🔗 Proxy: <span id="proxyInfo">Connecting...</span>
            </div>

        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <p>
                ⚡ <span class="highlight">MyStream Pro</span> —
                HLS Player · Livepush Style · No CORS Errors
                <br>
                <span style="font-size: 12px; color: var(--text-muted);">
                    <i class="fas fa-code"></i>
                    <a href="https://github.com/romika449-ai/Iluvpush" target="_blank">GitHub</a>
                    ·
                    <i class="fas fa-heart" style="color: var(--accent-red);"></i>
                    Made with ❤️
                </span>
            </p>
        </footer>

    </div>

    <!-- ============================================================ -->
    <!-- hls.js LIBRARY -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- ============================================================ -->
    <!-- MAIN JAVASCRIPT -->
    <!-- ============================================================ -->
    <script src="script.js"></script>

</body>
</html>
