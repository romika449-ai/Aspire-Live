<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>लाइव स्ट्रीम</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div class="container">
    <!-- हैडर -->
    <div class="header">
      <h1>📺 लाइव स्ट्रीम</h1>
      <div class="live-badge">लाइव</div>
    </div>

    <!-- वीडियो प्लेयर -->
    <div class="video-wrapper">
      <video id="videoPlayer" controls playsinline autoplay></video>
      
      <!-- साइड में लाइव बटन (क्लिक करने पर रिफ्रेश) -->
      <button class="live-side-btn" id="refreshLiveBtn">
        <span class="live-dot"></span> लाइव
      </button>
    </div>

    <!-- स्टेटस बार -->
    <div class="status-bar">
      <div class="viewer-count">
        <span class="status-dot"></span>
        <span class="status-text">लाइव चल रहा है</span>
      </div>
      <div class="viewer-count">
        <span class="label">👁️ देख रहे हैं:</span>
        <span class="number" id="viewerCount">0</span>
      </div>
    </div>

    <!-- एरर मैसेज -->
    <div id="errorMsg" class="error-msg">❌ वीडियो लोड नहीं हुआ। लिंक एक्सपायर हो सकता है।</div>
    
    <!-- फुटर -->
    <div class="footer">⚡ Render पर होस्ट किया गया</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
