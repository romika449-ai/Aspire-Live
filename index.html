<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>लाइव स्ट्रीम</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📺 लाइव स्ट्रीम</h1>
      <div class="live-badge">लाइव</div>
    </div>

    <div class="video-wrapper">
      <video id="videoPlayer" controls playsinline autoplay></video>
      
      <!-- साइड में लाइव बटन -->
      <button class="live-side-btn" id="liveBtn" title="लाइव स्ट्रीम पर जाएँ">
        <span class="live-dot"></span> लाइव
      </button>

      <!-- रेज़ोल्यूशन कंट्रोल (वीडियो प्लेयर के अंदर) -->
      <div class="resolution-control" id="resolutionControl">
        <button class="res-btn active" data-res="auto">Auto</button>
        <button class="res-btn" data-res="1080">1080p</button>
        <button class="res-btn" data-res="720">720p</button>
        <button class="res-btn" data-res="480">480p</button>
        <button class="res-btn" data-res="360">360p</button>
      </div>
    </div>

    <div class="status-bar">
      <div class="viewer-count">
        <span class="status-dot"></span>
        <span class="status-text">लाइव चल रहा है</span>
      </div>
      <div class="viewer-count">
        <span class="label">👁️ देख रहे हैं:</span>
        <span class="number" id="viewerCount">0</span>
      </div>
    </div>

    <div id="errorMsg" class="error-msg">❌ वीडियो लोड नहीं हुआ। लिंक एक्सपायर हो सकता है।</div>
    <div class="footer">⚡ Render पर होस्ट किया गया</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
