<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveStream Pro - HLS Player</title>
    <!-- ============================================================ -->
    <!-- FONTS & ICONS -->
    <!-- ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ================================================================
                   CSS - PROFESSIONAL DARK THEME
                   ================================================================ */

        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121e;
            --bg-card: #1a1a2e;
            --bg-input: #0f0f23;
            --border-color: #2a2a4e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a8a;
            --accent-gold: #f7971e;
            --accent-gold-light: #ffd200;
            --accent-green: #00ff88;
            --accent-red: #ff0044;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-gold);
            border-radius: 10px;
        }

        /* ----- CONTAINER ----- */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* ----- HEADER / NAVBAR ----- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a0a12;
            font-weight: 800;
        }

        .brand-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 68, 0.15);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 0, 68, 0.3);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        .live-text {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ----- MAIN CARD ----- */
        .main-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 28px;
            box-shadow: var(--shadow);
        }

        /* ----- PLAYER WRAPPER ----- */
        .player-wrapper {
            position: relative;
            background: #000000;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            margin-bottom: 20px;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* ----- CONTROLS BAR (Extension Style) ----- */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background: var(--bg-secondary);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .controls-bar .url-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .controls-bar .url-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
        }

        .controls-bar .url-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(247, 151, 30, 0.15);
        }

        .controls-bar .url-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            color: #0a0a12;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }

        /* ----- STATUS BAR ----- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-item .label {
            color: var(--text-secondary);
        }

        .status-item .value {
            font-weight: 600;
            color: var(--accent-green);
        }

        .status-item .value.error {
            color: var(--accent-red);
        }

        .status-dot-green {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.5s infinite;
        }

        /* ----- MESSAGE ----- */
        .message {
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.success {
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid var(--accent-green);
        }

        .message.info {
            color: var(--accent-gold);
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid var(--accent-gold);
        }

        /* ----- FOOTER ----- */
        .footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--accent-gold);
        }

        .footer .highlight {
            color: var(--accent-gold);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .main-card {
                padding: 16px;
            }
            .navbar {
                padding: 12px 16px;
            }
            .brand-text {
                font-size: 16px;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .controls-bar .url-input {
                min-width: 100%;
            }
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .brand-text {
                font-size: 14px;
            }
            .nav-status .live-text {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ========================================================== -->
        <!-- NAVBAR -->
        <!-- ========================================================== -->
        <header class="navbar">
            <a href="#" class="brand">
                <span class="brand-icon"><i class="fas fa-play"></i></span>
                <span class="brand-text">LiveStream Pro</span>
            </a>
            <div class="nav-status">
                <span class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">लाइव</span>
                </span>
                <span style="color: var(--text-muted); font-size: 13px;">
                    <i class="fas fa-users" style="margin-right: 4px;"></i>
                    <span id="viewerCountNav">0</span>
                </span>
            </div>
        </header>

        <!-- ========================================================== -->
        <!-- MAIN CARD -->
        <!-- ========================================================== -->
        <main class="main-card">

            <!-- ===== VIDEO PLAYER ===== -->
            <div class="player-wrapper">
                <video id="videoPlayer" controls playsinline autoplay preload="auto"></video>
            </div>

            <!-- ===== CONTROLS BAR ===== -->
            <div class="controls-bar">
                <span class="url-label"><i class="fas fa-link"></i> URL</span>
                <input type="text" class="url-input" id="videoUrlInput"
                placeholder="https://example.com/stream.m3u8"
                value="https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8">
                <button class="btn btn-primary" onclick="loadManualLink()">
                    <i class="fas fa-play"></i> Play
                </button>
                <button class="btn btn-outline" onclick="resetPlayer()">
                    <i class="fas fa-undo-alt"></i>
                </button>
            </div>

            <!-- ===== STATUS BAR ===== -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot-green"></span>
                    <span class="label">स्थिति:</span>
                    <span class="value" id="statusText">तैयार</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-eye"></i> दर्शक:</span>
                    <span class="value" id="viewerCount">0</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                    <span class="value" id="playerInfo">hls.js</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-signal"></i> क्वालिटी:</span>
                    <span class="value" id="qualityInfo">-</span>
                </div>
            </div>

            <!-- ===== MESSAGE ===== -->
            <div id="message" class="message"></div>

        </main>

        <!-- ========================================================== -->
        <!-- FOOTER -->
        <!-- ========================================================== -->
        <footer class="footer">
            <p>
                ⚡ <span class="highlight">LiveStream Pro</span> —
                HLS Player · कोई Extension नहीं · कोई CORS Error नहीं
                <br>
                <span style="font-size: 12px; color: var(--text-muted);">
                    <i class="fas fa-code"></i>
                    <a href="https://github.com/romika449-ai/Iluvpush" target="_blank">GitHub</a>
                    ·
                    <i class="fas fa-heart" style="color: var(--accent-red);"></i>
                    Made with ❤️
                </span>
            </p>
        </footer>

    </div>

    <!-- ============================================================ -->
    <!-- hls.js LIBRARY (CDN) -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest">
    </script>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - PRO LEVEL PLAYER -->
    <!-- ============================================================ -->
    <script>
        /**
         * ================================================================
         *  🚀 LiveStream Pro - HLS Player
         *  - Extension-style CORS Proxy + Custom Headers
         *  - Auto Proxy Switching
         *  - Auto Retry & Recovery
         *  - Buffer Management
         *  - Professional UI/UX
         * ================================================================
         */

        // ============================================================
        // 🔴 DEFAULT .m3u8 LINK (Change this to your real link)
        // ============================================================
        const DEFAULT_VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        // ============================================================
        // 🌐 CORS PROXY LIST (Extension-style)
        // ============================================================
        const PROXY_LIST = [
            'https://corsproxy.io/?url=',
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/',
            'https://proxy.cors.sh/',
            'https://thingproxy.freeboard.io/fetch/'
        ];
        let currentProxyIndex = 0;

        function getProxyUrl(url) {
            // अगर URL पहले से proxy के साथ है तो वापस करें
            if (url.startsWith('https://corsproxy.io/') ||
                url.startsWith('https://api.allorigins.win/') ||
                url.startsWith('https://cors-anywhere.herokuapp.com/') ||
                url.startsWith('https://proxy.cors.sh/') ||
                url.startsWith('https://thingproxy.freeboard.io/fetch/')) {
                return url;
            }
            return PROXY_LIST[currentProxyIndex] + encodeURIComponent(url);
        }

        function nextProxy() {
            currentProxyIndex = (currentProxyIndex + 1) % PROXY_LIST.length;
            console.log('🔄 Proxy switched to:', PROXY_LIST[currentProxyIndex]);
            showMessage(`🔄 Proxy बदला: ${PROXY_LIST[currentProxyIndex]}`, 'info');
        }

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const video = document.getElementById('videoPlayer');
        const urlInput = document.getElementById('videoUrlInput');
        const statusText = document.getElementById('statusText');
        const viewerCountEl = document.getElementById('viewerCount');
        const viewerCountNav = document.getElementById('viewerCountNav');
        const playerInfo = document.getElementById('playerInfo');
        const qualityInfo = document.getElementById('qualityInfo');
        const messageEl = document.getElementById('message');

        // ============================================================
        // 🧠 STATE
        // ============================================================
        let hls = null;
        let retryCount = 0;
        const MAX_RETRIES = 999;
        let currentUrl = DEFAULT_VIDEO_URL;
        let isManualLoad = false;
        let useProxy = true;

        // ============================================================
        // 👁️ VIEWER COUNTER (Simulated)
        // ============================================================
              // 👁️ VIEWER COUNTER (Simulated)
        // ============================================================
        function startViewerCounter() {
            let count = Math.floor(Math.random() * 50) + 15;
            updateViewerCount(count);
            setInterval(() => {
                let change = Math.floor(Math.random() * 9) - 4;
                let newCount = parseInt(viewerCountEl.textContent) + change;
                if (newCount < 5) newCount = 5 + Math.floor(Math.random() * 15);
                if (newCount > 200) newCount = 150 + Math.floor(Math.random() * 50);
                updateViewerCount(newCount);
            }, 7000);
        }

        function updateViewerCount(count) {
            viewerCountEl.textContent = count;
            viewerCountNav.textContent = count;
        }
        startViewerCounter();

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message show ' + (type || 'info');
            if (type === 'success' || type === 'info') {
                clearTimeout(messageEl._hideTimer);
                messageEl._hideTimer = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 5000);
            }
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        // ============================================================
        // 🎬 LOAD VIDEO — PRO LEVEL
        // ============================================================
        function loadVideo(url) {
            if (!url || url.trim() === "") {
                showMessage("❌ कृपया एक वैध .m3u8 लिंक डालें!", "error");
                return;
            }

            currentUrl = url;
            hideMessage();
            statusText.textContent = "⏳ लोड हो रहा है...";
            statusText.className = 'value';
            playerInfo.textContent = "लोड हो रहा...";
            qualityInfo.textContent = "-";

            if (hls) {
                hls.destroy();
                hls = null;
            }

            // ============================================================
            // PROXY URL
            // ============================================================
            let finalUrl = url;
            if (useProxy) {
                finalUrl = getProxyUrl(url);
                console.log('🌐 Proxy URL:', finalUrl);
            }

            // ============================================================
            // SAFARI / iOS — Native HLS
            // ============================================================
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = finalUrl;
                video.play().catch(() => {
                    showMessage("⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ", "info");
                });
                statusText.textContent = "✅ चल रहा है (Native)";
                playerInfo.textContent = "Safari Native";
                showMessage("✅ वीडियो लोड हो गया!", "success");
                return;
            }

            // ============================================================
            // hls.js — Extension-style with Custom Headers + Proxy
            // ============================================================
            if (Hls.isSupported()) {
                try {
                    hls = new Hls({

                        // ---- PERFORMANCE ----
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 60,
                        maxMaxBufferLength: 120,
                        maxBufferSize: 60 * 1000 * 1000,
                        startFragPrefetch: true,

                        // ---- LIVE STREAM ----
                        liveDurationInfinity: true,
                        liveMaxLatencyDurationCount: 10,
                        liveSyncDurationCount: 10,

                        // ---- TIMEOUT ----
                        fragLoadingTimeOut: 60000,
                        manifestLoadingTimeOut: 60000,
                        levelLoadingTimeOut: 60000,

                        // ---- ABR ----
                        abrEwmaDefaultEstimate: 500000,
                        abrEwmaFastLive: 3.0,
                        abrEwmaSlowLive: 9.0,
                        testBandwidth: true,

                        // ---- 🔥 EXTENSION-STYLE HEADERS ----
                        xhrSetup: function(xhr, url) {
                            xhr.setRequestHeader('Referer', 'https://classplusapp.com/');
                            xhr.setRequestHeader('Origin', 'https://classplusapp.com/');
                            xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                            xhr.withCredentials = true;
                            console.log('📡 Headers set for:', url);
                        }
                    });

                    hls.loadSource(finalUrl);
                    hls.attachMedia(video);

                    // ============================================================
                    // 🎯 EVENT: MANIFEST PARSED
                    // ============================================================
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        console.log('✅ MANIFEST PARSED');
                        statusText.textContent = "✅ चल रहा है";
                        statusText.className = 'value';
                        playerInfo.textContent = "hls.js v" + Hls.version + (useProxy ? ' 🌐Proxy' : '');
                        showMessage("✅ वीडियो लोड हो गया!", "success");
                        video.play().catch(() => {
                            showMessage("⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ", "info");
                        });
                    });

                    // ============================================================
                    // 🎯 EVENT: FRAGMENT LOADED
                    // ============================================================
                    hls.on(Hls.Events.FRAG_LOADED, function() {
                        statusText.textContent = "✅ चल रहा है";
                        statusText.className = 'value';
                        hideMessage();
                    });

                    // ============================================================
                    // 🎯 EVENT: BUFFER STALLED — Auto Recovery
                    // ============================================================
                    hls.on(Hls.Events.BUFFER_STALLED, function() {
                        console.log('🔄 BUFFER STALLED, recovering...');
                        statusText.textContent = "🔄 बफर...";
                        statusText.className = 'value';
                        showMessage("🔄 बफर रिफ्रेश...", "info");
                        setTimeout(() => {
                            if (hls) hls.startLoad();
                        }, 1000);
                    });

                    // ============================================================
                    // 🎯 EVENT: LEVEL LOADED — Quality Info
                    // ============================================================
                    hls.on(Hls.Events.LEVEL_LOADED, function(event, data) {
                        if (data && data.details) {
                            const level = data.details;
                            const height = level.height || '?';
                            const bitrate = level.averageBitrate ? (level.averageBitrate / 1000).toFixed(0) : '?';
                            qualityInfo.textContent = `${height}p @ ${bitrate}kbps`;
                        }
                    });

                    // ============================================================
                    // 🎯 EVENT: ERROR — Auto Recovery + Proxy Switch
                    // ============================================================
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.log('⚠️ ERROR:', data.type, data.details);

                        // ---- PROXY SWITCH ON NETWORK ERROR ----
                        if (useProxy &&
                            (data.type === Hls.ErrorTypes.NETWORK_ERROR ||
                                data.details === 'manifestLoadError' ||
                                data.details === 'manifestIncompatibleCodecsError')) {
                            if (currentProxyIndex < PROXY_LIST.length - 1) {
                                console.log('🔄 Switching proxy...');
                                showMessage(`🔄 Proxy बदल रहा है...`, 'info');
                                nextProxy();
                                setTimeout(() => {
                                    loadVideo(currentUrl);
                                }, 1500);
                                return;
                            }
                        }

                        // ---- FATAL ERROR RECOVERY ----
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log('🔄 NETWORK ERROR, recovering...');
                                    statusText.textContent = "🔄 कनेक्शन...";
                                    showMessage("🔄 कनेक्शन पुनः स्थापित...", "info");
                                    setTimeout(() => {
                                        if (hls) hls.startLoad();
                                    }, 1500);
                                    break;

                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log('🔄 MEDIA ERROR, recovering...');
                                    statusText.textContent = "🔄 मीडिया...";
                                    showMessage("🔄 मीडिया पुनः लोड...", "info");
                                    setTimeout(() => {
                                        if (hls) hls.recoverMediaError();
                                    }, 1500);
                                    break;

                                default:
                                    if (retryCount < MAX_RETRIES) {
                                        retryCount++;
                                        console.log(`🔄 Retry ${retryCount}/${MAX_RETRIES}...`);
                                        statusText.textContent = `🔄 प्रयास ${retryCount}...`;
                                        showMessage(`🔄 पुनः प्रयास ${retryCount}...`, "info");
                                        setTimeout(() => {
                                            loadVideo(url);
                                        }, 2000);
                                    } else {
                                        showMessage("❌ वीडियो नहीं चल रहा। नया लिंक डालें।", "error");
                                        statusText.textContent = "❌ एरर";
                                        statusText.className = 'value error';
                                        playerInfo.textContent = "Error";
                                    }
                                    break;
                            }
                        } else {
                            // ---- NON-FATAL: Fragment error retry ----
                            if (data.details === 'fragLoadError' || data.details === 'fragParsingError') {
                                console.log('🔄 Fragment error, retrying...');
                                setTimeout(() => {
                                    if (hls) hls.startLoad();
                                }, 1000);
                            }
                        }
                    });

                } catch (error) {
                    console.error('❌ hls.js Error:', error);
                    showMessage("❌ प्लेयर एरर: " + error.message, "error");
                    statusText.textContent = "❌ एरर";
                    statusText.className = 'value error';
                }

            } else {
                showMessage("❌ आपका ब्राउज़र HLS सपोर्ट नहीं करता।", "error");
                statusText.textContent = "❌ Unsupported";
                statusText.className = 'value error';
            }
        }

        // ============================================================
        // 🔧 LOAD MANUAL LINK
        // ============================================================
        function loadManualLink() {
            const url = urlInput.value.trim();
            if (url) {
                isManualLoad = true;
                retryCount = 0;
                currentProxyIndex = 0;
                loadVideo(url);
                localStorage.setItem('savedLink', url);
                showMessage("✅ नया लिंक लोड किया जा रहा है...", "info");
            } else {
                showMessage("❌ कृपया पहले लिंक डालें!", "error");
            }
        }

        // ============================================================
        // 🔄 RESET PLAYER
        // ============================================================
        function resetPlayer() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.pause();
            video.removeAttribute('src');
            video.load();
            statusText.textContent = "तैयार";
            statusText.className = 'value';
            playerInfo.textContent = "hls.js";
            qualityInfo.textContent = "-";
            hideMessage();
            showMessage("🔄 प्लेयर रीसेट हो गया", "info");
            console.log('🔄 Player reset');
        }

        // ============================================================
        // ⌨️ ENTER KEY SUPPORT
        // ============================================================
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadManualLink();
            }
        });

        // ============================================================
        // 🚀 PAGE LOAD — DEFAULT LINK
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedLink = localStorage.getItem('savedLink');
            let linkToLoad = DEFAULT_VIDEO_URL;

            if (savedLink && savedLink !== "null" && savedLink !== "") {
                linkToLoad = savedLink;
                urlInput.value = savedLink;
            } else {
                urlInput.value = DEFAULT_VIDEO_URL;
            }

            if (linkToLoad && linkToLoad !== "https://example.com/stream.m3u8") {
                loadVideo(linkToLoad);
            } else {
                showMessage("❌ DEFAULT_VIDEO_URL में .m3u8 लिंक डालें।", "error");
                statusText.textContent = "❌ कोई लिंक नहीं";
                statusText.className = 'value error';
            }

            if (typeof Hls !== 'undefined' && Hls.version) {
                console.log('📦 hls.js v' + Hls.version);
            }

            console.log('✅ LiveStream Pro initialized!');
            console.log('📺 Default Link:', DEFAULT_VIDEO_URL);
            console.log('🌐 Proxy List:', PROXY_LIST);
            console.log('💡 Extension-style player — ready to rock! 🚀');
        });

        // ============================================================
        // 🔄 AUTO-RETRY — Video Stall Recovery
        // ============================================================
        setInterval(function() {
            if (!video) return;

            // अगर वीडियो रुका है और बफर नहीं हो रहा
            if (video.paused && video.currentTime > 0 && !video.ended && video.readyState < 2 && !isManualLoad) {
                console.log('🔄 Video stalled, reloading...');
                statusText.textContent = "🔄 रिलोड...";
                showMessage("🔄 वीडियो पुनः लोड...", "info");
                const src = localStorage.getItem('savedLink') || DEFAULT_VIDEO_URL;
                if (src) loadVideo(src);
            }

            // अगर बफर 2 सेकंड से कम है
            if (video.buffered.length > 0 && !video.paused && !isManualLoad) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const currentTime = video.currentTime;
                if (bufferedEnd - currentTime < 2 && video.readyState < 3) {
                    console.log('🔄 Buffer low, refreshing...');
                    statusText.textContent = "🔄 बफर...";
                    const src = localStorage.getItem('savedLink') || DEFAULT_VIDEO_URL;
                    if (src) loadVideo(src);
                }
            }
        }, 5000);
    </script>

</body>
